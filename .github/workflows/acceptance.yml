name: acceptance

# Capability scenarios (acceptance/features) against a freshly built wheel, with the release gate
# (PROMOTE / CONDITIONAL / BLOCK). The gate summary is written to the job summary; BLOCK fails the job.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: capability acceptance (built wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "latest"
          enable-cache: false

      - name: Build the wheel and run the scenarios against it
        run: make acceptance-wheel

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: acceptance-report
          path: acceptance/report/
          if-no-files-found: warn

  compatibility:
    # The supported-version matrix: the same wheel and scenarios on the oldest Ananke Dev Guru declares and on the
    # newest, each without Dex (the internal route) and with Dex Trove installed (the Dex route). The floor is read
    # from pyproject.toml, so it can't drift from what the package declares.
    name: compatibility (ananke ${{ matrix.ananke }}, ${{ matrix.route }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ananke: [floor, latest]
        route: [internal, dex]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081
        with:
          version: "latest"
          enable-cache: false

      - name: Choose the versions
        id: pins
        env:
          ANANKE: ${{ matrix.ananke }}
          ROUTE: ${{ matrix.route }}
        run: |
          floor=$(sed -n 's/.*"ananke-plexus>=\([0-9.]*\),.*/\1/p' pyproject.toml)
          test -n "$floor" || { echo "no ananke-plexus floor in pyproject.toml"; exit 1; }
          pins=""
          if [ "$ANANKE" = "floor" ]; then pins="ananke-plexus==$floor"; fi
          if [ "$ROUTE" = "dex" ]; then pins="$pins dex-trove"; fi
          echo "pins=$pins" >> "$GITHUB_OUTPUT"
          echo "Ananke $ANANKE (floor $floor), route $ROUTE: pins '$pins'" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the wheel and run the scenarios against it
        env:
          PINS: ${{ steps.pins.outputs.pins }}
        run: make acceptance-wheel ACCEPTANCE_PINS="$PINS"

      - name: Record what was tested
        if: always()
        run: .acceptance-venv/bin/python -c "import importlib.metadata as m; print({p: (m.version(p) if p in {d.metadata['Name'].lower() for d in m.distributions()} else None) for p in ('dev-guru', 'ananke-plexus', 'dex-trove', 'pydantic')})" >> "$GITHUB_STEP_SUMMARY"
