[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dev-guru"
dynamic = ["version"]
description = "Dev Guru: understand, improve, verify and learn from your software. A local-first developer product on the Ananke Plexus harness: Python SDK and CLI, offline HTML reports and a local web interface."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Neo Pragnya" }]
keywords = ["developer-tools", "code-understanding", "ananke", "agents", "reports"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
# Dev Guru is a client of Ananke: the harness owns analysis, execution and evidence (docs/architecture.md).
# Keep this range in step with SUPPORTED_ANANKE in src/dev_guru/client/negotiation.py (tests/test_packaging.py).
dependencies = [
  "ananke-plexus>=0.3.30,<0.4",
  "markdown-it-py>=3,<5",
  "pydantic>=2.11,<3",
  "rich>=13",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
# Optional capability memory. Dev Guru must work without it.
dex = ["dex-trove>=0.1.6"]
dev = [
  "hatchling>=1.26",
  "mypy>=1.15",
  "pytest>=8",
  "pytest-bdd>=8",
  "pytest-cov>=6",
  "pytest-xdist>=3",
  "pyyaml>=6",
  "ruff>=0.12",
  "types-pyyaml>=6",
]

[project.scripts]
dev = "dev_guru.cli:app"

[project.urls]
Homepage = "https://github.com/Neo-Pragnya/Dev-Guru"
Repository = "https://github.com/Neo-Pragnya/Dev-Guru"
Issues = "https://github.com/Neo-Pragnya/Dev-Guru/issues"
Changelog = "https://github.com/Neo-Pragnya/Dev-Guru/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/dev_guru/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_guru"]  # includes reports/assets (the explorer page, styles and script)

[tool.hatch.build.targets.sdist]
# Anchored: an unanchored "src" also matched website/node_modules/*/src and shipped 2,754 npm files.
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["acceptance/harness.py", "scripts/scan_dist.py"]  # vendored byte-identical from Ananke-Plexus

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "SIM", "RUF"]
ignore = ["B008", "E501"]  # B008: Typer defaults; E501: ruff format owns line length

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "S607"]
"acceptance/**/*.py" = ["S101", "S603", "S607", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src/dev_guru"]

# ananke-plexus ships no py.typed marker yet (Ananke docs: reference/three-repository-audit.md).
[[tool.mypy.overrides]]
module = ["ananke.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/dev_guru"]
branch = true
