# What Dev Guru must be able to do before a release, and how much of the CLI the scenarios exercise.
# Scenarios prove capabilities by tagging themselves @cap_<id> (dots and dashes become underscores).
# blocker: true → a failing or unproven capability BLOCKs the release; the rest hold it at CONDITIONAL.
product: Dev Guru
default_fixture: shop
binaries: [dev]
surface_target: 0.9

capabilities:
  - { id: packaging, title: "Installs cleanly: entry point, version, fast start, no Node at runtime", dimension: release, blocker: true }
  - { id: harness, title: "Negotiates the Ananke harness: version range, required capabilities, one explicit transport", dimension: core, blocker: true }
  - { id: harness-graph, title: "The SDK reaches real Ananke analysis (graph of a fixture project), not a mock", dimension: core, blocker: true }
  - { id: dex-optional, title: "Works without Dex Trove; the core never imports it", dimension: architecture, blocker: true }
  - { id: explore, title: "dev explore: real Ananke graph → explorer view model → one offline HTML report + manifest", dimension: core, blocker: true }
  - { id: report-safety, title: "Reports are offline, view-only and treat source as text (hostile input stays inert)", dimension: safety, blocker: true }
  - { id: report-browser, title: "In real Chrome every view renders; search, palette, tour and theme work; fits a phone", dimension: experience, blocker: true }
  - { id: present, title: "dev present: offline, accessible decks; remote images and raw HTML refused", dimension: core, blocker: true }
  - { id: sources, title: "Source-neutral discovery; explore runs through the Ananke app facade and records the report; Dex-free", dimension: core, blocker: true }
  - { id: diagram, title: "dev diagram: cited SVG from documents; prose can't add edges; safe output", dimension: core, blocker: true }
  - { id: gateway, title: "dev serve: loopback only, single-use login, origin and CSRF checks, scoped workspaces; a run reaches real Ananke", dimension: security, blocker: true }
  - { id: web-shell, title: "The web interface ships in the wheel, needs no Node, works by keyboard and on a phone, and says plainly what isn't in this version", dimension: experience, blocker: true }
  - { id: run-console, title: "The run console catches up after a lost connection or a gap, survives a tab reload, and only cancels when asked", dimension: experience, blocker: true }
  - { id: cli-ux, title: "Errors are clean, carry stable codes, and refusals exit non-zero", dimension: usability, blocker: false }

# Every user-facing command.
surface:
  - dev
  - dev doctor
  - dev explore
  - dev present
  - dev diagram
  - dev sources
  - dev serve
  - dev learning review
